[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# ONE REPLICA IS A CORRECTNESS REQUIREMENT, NOT A COST DECISION.
#
# PGlite is single-connection and holds the data directory exclusively. Two
# replicas on one volume is the case ticket 01 measured: silent corruption and
# lost rows. The lease in db/lock.ts now refuses that — so a second replica
# does not corrupt anything, it simply fails to boot and crash-loops. Raising
# this number buys nothing and costs a broken service.
numReplicas = 1

# Restart rather than sit dead: the ordinary reason for a failed start is
# that the previous container has not released the lease yet, which resolves
# by itself within 30 seconds.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

healthcheckPath = "/"
healthcheckTimeout = 60
